<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0B09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Sauna Buddy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --char: #0E0B09;
    --char-2: #18130F;
    --card-border: rgba(243,228,198,0.12);
    --ember: #FF5B33;
    --ember-2: #FFB84D;
    --steam: #7FD8DE;
    --birch: #F3E4C6;
    --ash: rgba(243,228,198,0.72);
    --stone-cold: #3A4750;
    --steam-speed: 3.2s;
    --steam-intensity: 0.4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(ellipse 70% 50% at 50% 18%, rgba(255,91,51,0.16), transparent 60%),
      var(--char);
    color: var(--birch);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }

  .card {
    background: rgba(24,19,15,0.72);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    padding: 34px 26px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0,0,0,0.45);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(1.9rem, 7vw, 2.3rem);
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }

  .subtitle { font-size: 0.88rem; color: var(--ash); margin-bottom: 26px; }

  .reading-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ash);
    margin-bottom: 6px;
  }

  .reading-value {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: clamp(3.1rem, 14vw, 4.4rem);
    line-height: 1;
    color: var(--birch);
    text-shadow: 0 0 30px rgba(255,91,51,0.25);
  }

  .reading-status { font-size: 0.78rem; color: var(--ash); margin-top: 8px; min-height: 16px; }

  .stones-wrap { position: relative; margin: 22px 0 18px; padding-top: 30px; }

  .wisp {
    position: absolute;
    bottom: 40px;
    left: 22%;
    width: 22px;
    height: 34px;
    background: radial-gradient(circle, rgba(230,245,246,0.9), rgba(230,245,246,0) 70%);
    filter: blur(5px);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity: 0;
    animation: rise var(--steam-speed) ease-in infinite;
    pointer-events: none;
  }
  .wisp:nth-child(2) { left: 47%; width: 18px; animation-delay: 1.1s; }
  .wisp:nth-child(3) { left: 70%; width: 26px; animation-delay: 2.1s; }

  @keyframes rise {
    0%   { transform: translateY(4px) scale(0.7); opacity: 0; }
    20%  { opacity: var(--steam-intensity); }
    100% { transform: translateY(-52px) scale(1.3); opacity: 0; }
  }

  .stones-row { display: flex; gap: 6px; align-items: center; }

  .stone {
    flex: 1;
    height: 34px;
    border-radius: 40% 60% 55% 45% / 55% 45% 60% 40%;
    background: var(--stone-cold);
    opacity: 0.5;
    transition: background 0.6s ease, opacity 0.6s ease, box-shadow 0.6s ease;
  }
  .stone.lit { opacity: 1; }
  .stone.lit:nth-child(1) { background: #7FD8DE; box-shadow: 0 0 10px 1px rgba(127,216,222,0.55); }
  .stone.lit:nth-child(2) { background: #93D2C5; box-shadow: 0 0 10px 1px rgba(147,210,197,0.55); }
  .stone.lit:nth-child(3) { background: #A9C8A3; box-shadow: 0 0 10px 1px rgba(169,200,163,0.55); }
  .stone.lit:nth-child(4) { background: #C4BC81; box-shadow: 0 0 10px 1px rgba(196,188,129,0.55); }
  .stone.lit:nth-child(5) { background: #DEAE68; box-shadow: 0 0 11px 1px rgba(222,174,104,0.6); }
  .stone.lit:nth-child(6) { background: #F09E52; box-shadow: 0 0 12px 1px rgba(240,158,82,0.6); }
  .stone.lit:nth-child(7) { background: #FA8C45; box-shadow: 0 0 13px 2px rgba(250,140,69,0.65); }
  .stone.lit:nth-child(8) { background: #FF7239; box-shadow: 0 0 14px 2px rgba(255,114,57,0.7); }
  .stone.lit:nth-child(9) { background: #FF5B33; box-shadow: 0 0 16px 3px rgba(255,91,51,0.75); }

  .stones-scale {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--ash);
    padding: 8px 2px 0;
  }

  .dist-track { position: relative; height: 16px; margin-bottom: 18px; }
  .dist-dot {
    position: absolute;
    top: 0;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--birch);
    opacity: 0.85;
    transform: translateX(-50%);
    box-shadow: 0 0 4px rgba(243,228,198,0.6);
  }

  .selector-label { font-size: 0.85rem; color: var(--ash); margin-bottom: 10px; text-align: left; }

  .selector {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--char-2);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 8px;
    margin-bottom: 18px;
  }

  .btn-circle {
    background: rgba(243,228,198,0.08);
    border: 1px solid var(--card-border);
    color: var(--birch);
    width: 54px;
    height: 54px;
    border-radius: 12px;
    font-size: 1.5rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-circle:active { background: rgba(255,91,51,0.35); transform: scale(0.95); }

  .selected-val { font-family: 'IBM Plex Mono', monospace; font-size: 1.7rem; font-weight: 600; color: var(--birch); min-width: 100px; }

  .btn-submit {
    width: 100%;
    padding: 17px;
    border-radius: 14px;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: #1A0F08;
    background: linear-gradient(135deg, var(--ember-2), var(--ember));
    box-shadow: 0 10px 24px rgba(255,91,51,0.35);
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn-submit:active { transform: scale(0.98); }
  .btn-submit:disabled {
    background: var(--char-2);
    color: var(--ash);
    box-shadow: none;
    cursor: default;
    font-family: 'IBM Plex Mono', monospace;
    border: 1px solid var(--card-border);
  }

  .cooldown-hint { font-size: 0.75rem; color: var(--ash); margin-top: 8px; min-height: 14px; }
  .message { margin-top: 8px; font-size: 0.88rem; color: var(--steam); min-height: 20px; font-weight: 600; }

  .debug-section { margin-top: 26px; border-top: 1px dashed var(--card-border); padding-top: 16px; }
  .debug-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ash); margin-bottom: 8px; }
  .btn-small {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--ash);
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 0.72rem;
    cursor: pointer;
    margin: 3px;
    font-family: 'Inter', sans-serif;
  }
  .btn-small:active { background: rgba(243,228,198,0.08); }

  button:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .wisp { animation: none !important; opacity: 0 !important; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Sauna Buddy</h1>
    <p class="subtitle">Cast your vote — we average the room.</p>

    <div class="reading" role="status" aria-live="polite">
      <div class="reading-label">Target Temperature</div>
      <div class="reading-value" id="targetTemp">170°F</div>
      <div class="reading-status" id="tempStatus">Calculating…</div>
    </div>

    <div class="stones-wrap" aria-hidden="true">
      <div class="wisp"></div>
      <div class="wisp"></div>
      <div class="wisp"></div>
      <div class="stones-row">
        <div class="stone"></div>
        <div class="stone"></div>
        <div class="stone"></div>
        <div class="stone"></div>
        <div class="stone"></div>
        <div class="stone"></div>
        <div class="stone"></div>
        <div class="stone"></div>
        <div class="stone"></div>
      </div>
      <div class="stones-scale">
        <span id="scaleMin">150°</span>
        <span id="scaleMax">190°</span>
      </div>
    </div>

    <div class="dist-track" id="distTrack" aria-hidden="true"></div>

    <div class="selector-label">Select your preferred temp:</div>
    <div class="selector">
      <button class="btn-circle" onclick="adjustVote(-5)" aria-label="Decrease by 5 degrees">−</button>
      <div class="selected-val" id="voteVal">170°F</div>
      <button class="btn-circle" onclick="adjustVote(5)" aria-label="Increase by 5 degrees">+</button>
    </div>

    <button class="btn-submit" id="voteBtn" onclick="submitVote()">Vote Now</button>
    <div class="cooldown-hint" id="cooldownHint"></div>
    <div class="message" id="msg" aria-live="polite"></div>

    <div class="debug-section">
      <div class="debug-label">Demo &amp; testing tools — strip before production</div>
      <button class="btn-small" onclick="simulateVoters()">Simulate 5 voters</button>
      <button class="btn-small" onclick="addOldTestVote()">+ Vote (3h old)</button>
      <button class="btn-small" onclick="clearData()">Reset votes</button>
    </div>
  </div>

  <script>
    /*
     * TEMPERATURE RANGE — configure per facility before deployment.
     * 150-190°F sits inside the band public/commercial saunas commonly
     * run (North American Sauna Society cites ~158-194°F; the general
     * "safe ceiling for healthy adults" most sources give is around
     * 195°F, with heat-illness risk climbing past that). A gym serving
     * a general membership isn't the same as a private enthusiast's
     * home unit, so keep real, hardware-enforced limits at least this
     * conservative no matter what the crowd votes for — don't raise
     * MAX_TEMP toward water's boiling point (212°F); no mainstream
     * sauna-safety source treats that as a health target.
     */
    const MIN_TEMP = 150;
    const MAX_TEMP = 190;

    const VOTE_WINDOW_MS = 2 * 60 * 60 * 1000; // a vote counts toward the live average for 2 hours
    const COOLDOWN_MS = 30 * 60 * 1000;        // this device can cast a new vote every 30 minutes
    const NUM_STONES = 9;

    const VOTES_KEY = 'saunabuddy_votes';
    const DEVICE_KEY = 'saunabuddy_device_id';
    const LAST_VOTE_KEY = 'saunabuddy_last_vote_ts';

    let currentVoteSelection = Math.round((MIN_TEMP + MAX_TEMP) / 2);
    let lastShownTemp = null;

    // Identifies THIS device/browser — not the network's public IP.
    // Everyone on the gym's Wi-Fi shares one public IP behind NAT, so
    // true IP-based limiting would treat the whole room as one voter.
    // Per-device local storage is what actually tells people apart.
    // (A real anti-abuse layer — stopping one person from clearing
    // storage to vote repeatedly — needs a backend; see the notes below.)
    function getDeviceId() {
      let id = localStorage.getItem(DEVICE_KEY);
      if (!id) {
        id = 'device_' + Math.random().toString(36).slice(2, 11);
        localStorage.setItem(DEVICE_KEY, id);
      }
      return id;
    }

    function getVotes() {
      try { return JSON.parse(localStorage.getItem(VOTES_KEY) || '[]'); }
      catch (e) { return []; }
    }
    function saveVotes(votes) { localStorage.setItem(VOTES_KEY, JSON.stringify(votes)); }

    function clampTemp(t) { return Math.min(MAX_TEMP, Math.max(MIN_TEMP, t)); }

    function formatClock(ms) {
      const total = Math.ceil(ms / 1000);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return m + ':' + String(s).padStart(2, '0');
    }

    function msRemainingOnCooldown() {
      const last = Number(localStorage.getItem(LAST_VOTE_KEY) || 0);
      return Math.max(0, COOLDOWN_MS - (Date.now() - last));
    }

    function adjustVote(amount) {
      currentVoteSelection = clampTemp(currentVoteSelection + amount);
      document.getElementById('voteVal').textContent = currentVoteSelection + '°F';
    }

    function calculateTarget() {
      const votes = getVotes();
      const now = Date.now();
      const recent = votes.filter(v => (now - v.timestamp) <= VOTE_WINDOW_MS);

      if (recent.length > 0) {
        const avg = Math.round(recent.reduce((s, v) => s + v.temp, 0) / recent.length);
        return {
          temp: avg,
          status: `${recent.length} vote${recent.length === 1 ? '' : 's'} in the last 2 hours`,
          points: recent.map(v => v.temp)
        };
      }

      if (votes.length > 0) {
        const latestByDevice = {};
        votes.forEach(v => { latestByDevice[v.deviceId] = v.temp; });
        const vals = Object.values(latestByDevice);
        const avg = Math.round(vals.reduce((s, t) => s + t, 0) / vals.length);
        const suffix = vals.length === 1 ? "voter's" : "voters'";
        return { temp: avg, status: `No recent votes — showing ${vals.length} ${suffix} last pick`, points: vals };
      }

      return { temp: Math.round((MIN_TEMP + MAX_TEMP) / 2), status: 'No votes yet — be the first', points: [] };
    }

    function animateNumber(el, from, to) {
      const start = performance.now();
      const duration = 500;
      function tick(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = Math.round(from + (to - from) * eased) + '°F';
        if (t < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function renderStones(value) {
      const pct = Math.max(0, Math.min(1, (value - MIN_TEMP) / (MAX_TEMP - MIN_TEMP)));
      const litCount = Math.round(pct * NUM_STONES);
      document.querySelectorAll('.stone').forEach((el, i) => {
        el.classList.toggle('lit', i < litCount);
      });
      document.documentElement.style.setProperty('--steam-intensity', (0.3 + pct * 0.7).toFixed(2));
      document.documentElement.style.setProperty('--steam-speed', (3.4 - pct * 1.6).toFixed(2) + 's');
    }

    function renderDistribution(points) {
      const track = document.getElementById('distTrack');
      track.innerHTML = '';
      points.forEach(t => {
        const pct = Math.max(0, Math.min(1, (t - MIN_TEMP) / (MAX_TEMP - MIN_TEMP))) * 100;
        const dot = document.createElement('div');
        dot.className = 'dist-dot';
        dot.style.left = pct + '%';
        track.appendChild(dot);
      });
    }

    function updateCooldownUI() {
      const remaining = msRemainingOnCooldown();
      const btn = document.getElementById('voteBtn');
      const hint = document.getElementById('cooldownHint');
      if (remaining > 0) {
        btn.disabled = true;
        btn.textContent = `Next vote in ${formatClock(remaining)}`;
        hint.textContent = 'One vote per device every 30 minutes keeps this fair.';
      } else {
        btn.disabled = false;
        btn.textContent = 'Vote Now';
        hint.textContent = '';
      }
    }

    function updateUI() {
      const result = calculateTarget();
      const el = document.getElementById('targetTemp');
      animateNumber(el, lastShownTemp === null ? result.temp : lastShownTemp, result.temp);
      lastShownTemp = result.temp;
      document.getElementById('tempStatus').textContent = result.status;
      renderStones(result.temp);
      renderDistribution(result.points);
      updateCooldownUI();
    }

    function flashMsg(text) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      setTimeout(() => { msg.textContent = ''; }, 2500);
    }

    function submitVote() {
      if (msRemainingOnCooldown() > 0) return;
      const votes = getVotes();
      votes.push({ deviceId: getDeviceId(), temp: currentVoteSelection, timestamp: Date.now() });
      saveVotes(votes);
      localStorage.setItem(LAST_VOTE_KEY, String(Date.now()));
      flashMsg(`Vote for ${currentVoteSelection}°F recorded.`);
      updateUI();
    }

    function clearData() {
      localStorage.removeItem(VOTES_KEY);
      localStorage.removeItem(LAST_VOTE_KEY);
      lastShownTemp = null;
      updateUI();
      flashMsg('All local data reset.');
    }

    function addOldTestVote() {
      const votes = getVotes();
      votes.push({ deviceId: 'test_' + Math.random().toString(36).slice(2, 7), temp: 155, timestamp: Date.now() - (3 * 60 * 60 * 1000) });
      saveVotes(votes);
      updateUI();
      flashMsg('Added a vote timestamped 3h ago.');
    }

    function simulateVoters() {
      const now = Date.now();
      const sample = [150, 160, 170, 180, 190];
      const votes = getVotes();
      sample.forEach((t, i) => votes.push({ deviceId: 'demo_' + i + '_' + Math.random().toString(36).slice(2, 6), temp: t, timestamp: now - i * 1000 }));
      saveVotes(votes);
      updateUI();
      flashMsg('Simulated 5 voters — the classic example.');
    }

    document.getElementById('scaleMin').textContent = MIN_TEMP + '°';
    document.getElementById('scaleMax').textContent = MAX_TEMP + '°';
    document.getElementById('voteVal').textContent = currentVoteSelection + '°F';

    updateUI();
    setInterval(updateCooldownUI, 1000);
    setInterval(updateUI, 60000);
  </script>
</body>
</html>
